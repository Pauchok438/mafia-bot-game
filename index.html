<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мафия игра</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(135deg,#0a0f1e,#0c1222);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:system-ui;padding:20px;}
.game{max-width:500px;width:100%;background:rgba(20,28,40,0.95);border-radius:32px;padding:24px;border:1px solid rgba(255,255,255,0.1);}
h1{font-size:28px;text-align:center;color:#fff;}
.sub{text-align:center;color:#8b9dc3;font-size:14px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.1);}
.card{background:rgba(0,0,0,0.5);border-radius:20px;padding:20px;text-align:center;border:1px solid rgba(255,215,0,0.3);margin-bottom:20px;}
.icon{font-size:48px;}
.name{font-size:24px;font-weight:bold;color:#ffd966;}
.desc{color:#ccc;font-size:14px;}
.btns{display:flex;flex-direction:column;gap:12px;}
button{background:#2c3e66;border:none;padding:14px;border-radius:40px;color:white;font-size:16px;font-weight:600;cursor:pointer;}
button:active{transform:scale(0.97);}
.log{background:rgba(0,0,0,0.6);border-radius:20px;padding:16px;margin-top:20px;max-height:200px;overflow-y:auto;}
.log p{color:#aab8c5;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.night{color:#ffaa66;}
.day{color:#66ccff;}
.foot{text-align:center;margin-top:20px;font-size:11px;color:#4a5b7a;}
</style>
</head>
<body>
<div class="game">
<h1>🃏 МАФИЯ</h1>
<div class="sub">Город засыпает — просыпается мафия</div>
<div class="card">
<div class="icon" id="icon">❓</div>
<div class="name" id="name">???</div>
<div class="desc" id="desc">Нажми Новая игра</div>
</div>
<div class="btns">
<button id="btnNew">🌙 Новая игра</button>
<button id="btnNight">🔪 Ночь</button>
<button id="btnDay">🗳️ День</button>
</div>
<div class="log" id="log">
<p>🔮 Добро пожаловать в Мафию</p>
</div>
<div class="foot">🎭 Роли случайны</div>
</div>
<script>
let role=null, active=false, night=false;
const roles={mafia:{name:"Мафия",icon:"🔪",txt:"Ночью убиваешь"},civilian:{name:"Мирный",icon:"🏠",txt:"Днём голосуешь"},commissioner:{name:"Комиссар",icon:"🔍",txt:"Ночью проверяешь"},doctor:{name:"Доктор",icon:"💊",txt:"Ночью лечишь"}};
function log(msg,t){
let d=document.getElementById("log"),p=document.createElement("p");
p.innerHTML=msg;
if(t=="night")p.classList.add("night");
if(t=="day")p.classList.add("day");
d.appendChild(p);
d.scrollTop=d.scrollHeight;
while(d.children.length>12)d.removeChild(d.firstChild);
}
function ui(){if(!role)return;let r=roles[role];document.getElementById("icon").innerText=r.icon;document.getElementById("name").innerText=r.name;document.getElementById("desc").innerText=r.txt;}
function newGame(){let k=["mafia","civilian","commissioner","doctor"];role=k[Math.floor(Math.random()*k.length)];active=true;night=false;ui();log("✨ Новая игра! Ты "+roles[role].name+" "+roles[role].icon,"day");log("🌞 День. Город проснулся","day");if(role=="mafia")log("💀 Ночью можешь убить","night");else if(role=="commissioner")log("🔍 Ночью проверяй","night");else if(role=="doctor")log("💊 Ночью лечи","night");else log("🌙 Ночью спишь","night");}
function nightAct(){if(!active){log("Начни игру!");return;}if(!night){log("Сейчас день! Нажми День","day");return;}if(role=="mafia")log("🔪 Мафия убила мирного","night");else if(role=="commissioner")log(Math.random()>0.5?"🔍 Это МАФИЯ!":"🔍 Это мирный","night");else if(role=="doctor")log("💊 Ты спас игрока","night");else log("🌙 Ты спал","night");night=false;log("🌞 Наступило утро","day");}
function dayVote(){if(!active){log("Начни игру!");return;}if(night){log("Сейчас ночь! Нажми Ночь","night");return;}let r=Math.random();if(r>0.5){log("🗳️ Город казнил мафию! ПОБЕДА! 🏆","day");active=false;}else{log("🗳️ Город казнил мирного...","day");if(role!="mafia"){log("💀 Ты казнён. Игра окончена","day");active=false;}else{night=true;log("🌙 Ночь. Мафия просыпается","night");}}if(!active)log("🔄 Нажми Новая игра","day");}
document.getElementById("btnNew").onclick=newGame;
document.getElementById("btnNight").onclick=nightAct;
document.getElementById("btnDay").onclick=dayVote;
newGame();
</script>
</body>
</html>
